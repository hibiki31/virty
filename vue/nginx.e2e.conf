user                    nginx;
worker_processes        1;

error_log               /var/log/nginx/error.log warn;
pid                     /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;
    sendfile            on;

    server {
        listen 80;
        charset utf-8;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # page.routeの不足を実APIや別serviceへ流さず、testをfail closedにする。
        location = /api {
            return 502;
        }

        location /api/ {
            return 502;
        }

        location /novnc/ {
            return 502;
        }
    }
}
